name: dotnet-ci

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DocFlux.sln

      - name: Build
        run: dotnet build DocFlux.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DocFlux.sln --configuration Release --no-build
